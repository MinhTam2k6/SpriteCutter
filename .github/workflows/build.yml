name: Build SpriteCutter EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name SpriteCutter SpriteCutter.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: SpriteCutter-Windows
          path: dist/SpriteCutter.exe
